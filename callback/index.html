<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"/><title>BudgetManager — callback</title></head>
<body>
  <h1>Autorisation</h1>
  <p id="msg">En attente du code…</p>
  <pre id="code"></pre>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('msg').textContent =
        "Code reçu — redirection locale… (sinon copie-colle dans BudgetManager)";
      location.replace('http://localhost:8765/callback' + location.search);
    } else {
      document.getElementById('msg').textContent =
        "Pas de code dans l'URL. Relance l'auth depuis BudgetManager.";
    }
  </script></body>
</html>
